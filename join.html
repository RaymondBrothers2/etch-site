<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>ETCH — A moment is waiting for you</title><style>body{font-family:Georgia,serif;background:#0A1628;color:#EDE6D6;max-width:640px;margin:0 auto;padding:44px 22px;line-height:1.65}.brand{color:#C9A84C;letter-spacing:6px;font-size:14px;text-align:center}.rule{width:46px;height:1px;background:#C9A84C;opacity:.6;margin:20px auto}.foot{margin-top:44px;color:#A99E86;font-size:.85em;text-align:center}.big{font-size:1.3em;text-align:center;margin:22px 0 8px}.note{font-style:italic;color:#C9B98A;text-align:center}.ctr{text-align:center}.moment{border:2px solid #C9A84C;border-radius:6px;overflow:hidden;margin:26px auto;box-shadow:0 8px 30px rgba(0,0,0,.45)}.moment img,.moment video{display:block;width:100%;height:auto}.words{padding:26px;font-style:italic;font-size:1.15em;background:#101E33}.auth{font-family:Courier,monospace;font-size:.72em;letter-spacing:.14em;color:#A99E86;text-align:center;margin-top:10px}.cta{display:inline-block;background:#C9A84C;color:#0A1628;font-weight:bold;padding:13px 34px;border-radius:999px;text-decoration:none;margin-top:14px}.audio{padding:22px;background:#101E33;text-align:center}</style></head><body>
<div class="brand">E T C H</div><div class="rule"></div>
<div id="content"><p class="big">A moment is waiting for you.</p><p class="ctr">Opening&hellip;</p></div>
<script>
(async () => {
  const el = document.getElementById('content');
  const bad = () => { el.innerHTML = '<p class="big">This invite link isn\u2019t valid.</p><p class="ctr">Ask the sender to share it again from ETCH.</p>'; };
  const code = new URLSearchParams(location.search).get('m');
  if (!code) return bad();
  try {
    const r = await fetch('https://qbzasokxtmabecgyjuai.supabase.co/functions/v1/invite-info?m=' + encodeURIComponent(code));
    const d = await r.json();
    if (!d.valid) return bad();
    const esc = s => s ? s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : '';
    const who = esc(d.senderName || 'Someone');
    let sealed = '';
    if (d.sealedAt) { try { sealed = new Date(d.sealedAt).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); } catch(e){} }

    // The moment itself — the gift delivers on open.
    let momentHtml = '';
    if (d.contentType === 'photo' && d.mediaUrl) {
      momentHtml = '<div class="moment"><img src="' + d.mediaUrl + '" alt="The moment"></div>';
    } else if (d.contentType === 'video' && d.mediaUrl) {
      momentHtml = '<div class="moment"><video controls playsinline ' + (d.posterUrl ? 'poster="' + d.posterUrl + '"' : '') + ' src="' + d.mediaUrl + '"></video></div>';
    } else if ((d.contentType === 'voice' || d.contentType === 'audio') && d.mediaUrl) {
      momentHtml = '<div class="moment"><div class="audio"><p style="margin-top:0">Their voice, from that moment:</p><audio controls src="' + d.mediaUrl + '" style="width:100%"></audio></div></div>';
    } else if (d.text) {
      momentHtml = '<div class="moment"><div class="words">&ldquo;' + esc(d.text) + '&rdquo;</div></div>';
    }

    el.innerHTML =
      '<p class="big">' + who + ' sent you a moment.</p>'
      + (d.note ? '<p class="note">&ldquo;' + esc(d.note) + '&rdquo;</p>' : '')
      + momentHtml
      + (sealed ? '<div class="auth">AUTHENTICATED &middot; ETCH LEDGER &middot; SEALED ' + sealed.toUpperCase() + '</div>' : '')
      + '<p class="ctr" style="margin-top:30px">This is a real, sealed moment from ' + who + '\u2019s permanent life record.</p>'
      + '<p class="ctr"><b>Keep it forever:</b> join ETCH with the email or phone this was sent to, and it lands on your own record.</p>'
      + '<p class="ctr"><a class="cta" href="https://testflight.apple.com/join/1HcnXT4B">Get ETCH (beta)</a></p>';
  } catch (e) { bad(); }
})();
</script>
<div class="foot">Time · Air · Breath — another day given.</div></body></html>
