<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>ETCH — A moment is waiting for you</title><style>body{font-family:Georgia,serif;background:#0A1628;color:#EDE6D6;max-width:640px;margin:0 auto;padding:56px 24px;line-height:1.65}h1{font-size:1.5em}h2{font-size:1.1em;margin-top:1.6em}.brand{color:#C9A84C;letter-spacing:6px;font-size:14px;text-align:center}.rule{width:46px;height:1px;background:#C9A84C;opacity:.6;margin:22px auto}.foot{margin-top:44px;color:#A99E86;font-size:.85em;text-align:center}small{color:#A99E86}.big{font-size:1.35em;text-align:center;margin:26px 0 8px}.note{font-style:italic;color:#C9B98A;text-align:center}.ctr{text-align:center}</style></head><body>
<div class="brand">E T C H</div><div class="rule"></div>
<div id="content"><p class="big">A moment is waiting for you.</p><p class="ctr">Loading&hellip;</p></div>
<script>
(async () => {
  const el = document.getElementById('content');
  const code = new URLSearchParams(location.search).get('m');
  if (!code) { el.innerHTML = '<p class="big">This invite link isn\u2019t valid.</p><p class="ctr">Ask the sender to share it again from ETCH.</p>'; return; }
  try {
    const r = await fetch('https://qbzasokxtmabecgyjuai.supabase.co/functions/v1/invite-info?m=' + encodeURIComponent(code));
    const d = await r.json();
    if (!d.valid) throw 0;
    const esc = s => s ? s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : '';
    el.innerHTML = '<p class="big">' + esc(d.senderName || 'Someone') + ' sent you a moment on ETCH.</p>'
      + (d.note ? '<p class="note">&ldquo;' + esc(d.note) + '&rdquo;</p>' : '')
      + '<p class="ctr">ETCH is a private, permanent record of a life. A real moment — captured, sealed, and timestamped — is waiting for you.</p>'
      + '<p class="ctr"><b>To receive it:</b> download ETCH and sign up with the email or phone this invite was sent to. The moment lands on your record the minute you join.</p>';
  } catch (e) {
    el.innerHTML = '<p class="big">This invite link isn\u2019t valid.</p><p class="ctr">Ask the sender to share it again from ETCH.</p>';
  }
})();
</script>
<div class="foot">Time · Air · Breath — another day given.</div></body></html>
